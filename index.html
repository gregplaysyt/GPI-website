    <title>Girls' Power Initiative — Empowering girls to become catalysts for change</title>
    <script>
      // GitHub Pages serves index.html with a "?/path" query when someone opens
      // a sub-page directly (see public/404.html). Restore that path into the
      // address bar before the app loads, so React Router can route correctly.
      (function () {
        var search = window.location.search;
        if (search && search.charAt(1) === '/') {
          var decoded = search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(
            null,
            '',
            window.location.pathname.slice(0, -1) + decoded + window.location.hash
          );
        }
      })();
    </script>
